<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portal do Peixe | Login</title>
    <link rel="icon" href="Imagens/logo_portal_sem_nome.png" type="image/png">
    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="./assets/icon/favicon2.ico">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body>
    <!--Header-->
    <header class="menu">
        <div class="menu-esquerda">
            <a href="index.html#quem_somos">Quem somos</a>
            <a href="index.html#historia">História</a>
            <a href="index.html#jogadores">Jogadores</a>
        </div>

        <div class="menu-centro">
            <a href="index.html">
                <img src="Imagens/logo_portal.png" alt="Logo do Santos FC" class="logo">
            </a>
        </div>

        <div class="menu-direita">
            <a href="login.html">Login</a>
            <a href="cadastro.html">Cadastro</a>
        </div>
    </header>

    <!-- Tela de Login -->
    <div class="login-branco">
        <div class="card-login-branco">
            <img src="Imagens/logo_portal.png" class="logo-login" alt="Logo Santos" />
            <h2>Bem-vindo de volta, Santista!</h2>

            <div class="alerta_erro" id="cardErro">
                <span id="mensagem_erro"></span>
            </div>

            <div class="formulario-login">
                <input id="email_input" type="text" placeholder="E-mail" />
                <input id="senha_input" type="password" placeholder="Senha" />
                <button class="botao-dourado" onclick="entrar()">Entrar</button>
            </div>

            <div id="div_erros_login"></div>
        </div>
    </div>

</body>


</html>

<script>


    function entrar() {
        aguardar();

        // Pega os valores digitados nos campos
        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        // Validações
        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);


        // Aqui está enviando um POST para /usuarios/autenticar com o email e senha para o backend fazer a autenticação
        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })

            // Se o backend responder com sucesso(resposta.ok), pega os dados do usuário no JSON.
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);
                // Armazena esses dados no sessionStorage
                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id

                    // Depois de um segundo redireciona para a dashboard
                    setTimeout(function () {
                        window.location = "./dashboard/dashboard.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                // Se houver erro exibe erro
                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
